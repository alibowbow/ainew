 $("#modalRoot").innerHTML='<div class="modal-layer" data-close-modal="true"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-head"><div><h2 id="modalTitle">모델 비교</h2></div><button type="button" class="modal-close" data-action="close-modal" aria-label="비교 창 닫기">×</button></div><div class="compare-table"><table><thead><tr><th>항목</th>'+models.map(function(m){return'<th>'+esc(m.name)+'<br><button type="button" class="source-link" data-pin="'+esc(m.id)+'">고정 해제</button></th>'}).join("")+'</tr></thead><tbody>'+fields.map(function(f){return'<tr><td>'+f[0]+'</td>'+models.map(function(m){return'<td>'+esc(f[1](m))+'</td>'}).join("")+'</tr>'}).join("")+'</tbody></table></div></section></div>';

function closeModal(){$("#modalRoot").innerHTML="";document.body.classList.remove("modal-open");state.modal=null;if(state.lastFocus&&state.lastFocus.focus)state.lastFocus.focus()}
function pin(id){var i=state.pins.indexOf(id);if(i>-1){state.pins.splice(i,1);toast("비교 고정에서 제거했습니다.")}else{if(state.pins.length>=4){toast("비교는 최대 4개 모델까지 고정할 수 있습니다.");return}state.pins.push(id);toast("비교에 고정했습니다.")}save();render();if(state.modal&&state.modal.kind==="model")openModel(id);else if(state.modal&&state.modal.kind==="compare")openCompare()}
function page(value){var a=value.split(":"),scope=a[0],n=Math.max(1,Number(a[1])||1);if(scope==="catalog")state.catalogPage=n;if(scope==="media")state.mediaPage=n;render();window.scrollTo({top:0,behavior:"auto"})}
function bind(){
 document.addEventListener("click",function(e){
  var back=e.target.closest("[data-close-modal=true]");if(back&&e.target===back){closeModal();return}

  var ca=e.target.closest("[data-catalog-access]");if(ca){state.catalogAccess=ca.dataset.catalogAccess;state.catalogPage=1;render();return}
  var cc=e.target.closest("[data-catalog-category]");if(cc){state.catalogCategory=cc.dataset.catalogCategory;state.catalogPage=1;render();return}
  var mc=e.target.closest("[data-media-category]");if(mc){state.mediaCategory=mc.dataset.mediaCategory;state.mediaPage=1;render();return}

 });
 document.addEventListener("input",function(e){if(e.target&&e.target.id==="catalogSearch"){state.catalogQuery=e.target.value;state.catalogPage=1;render("#catalogSearch")}});
 document.addEventListener("change",function(e){if(!e.target)return;if(e.target.id==="catalogRegion"){state.catalogRegion=e.target.value;state.catalogPage=1;render()}if(e.target.id==="catalogAccess"){state.catalogAccess=e.target.value;state.catalogPage=1;render()}if(e.target.id==="catalogSort"){state.catalogSort=e.target.value;state.catalogPage=1;render()}});

  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){e.preventDefault();$("#globalSearch").focus();return}

 });
