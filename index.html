const HISTORY=[{"color":"#2558db","date":"1943","era":"foundations","impact":"뇌의 생물학적 복제보다 계산 가능한 구조에 초점을 둔 출발점입니다.","source":"https://www.computerhistory.org/timeline/ai-robotics/","sourceLabel":"Computer History Museum","tag":"신경망","text":"McCulloch와 Pitts는 단순화한 뉴런 연결로 논리 연산을 설명했습니다.","title":"인공 뉴런을 논리 계산으로 표현"},{"color":"#2558db","date":"1950.10","era":"foundations","impact":"대화에서의 설득력과 실제 이해·신뢰성은 별도로 검증해야 한다는 질문이 남았습니다.","source":"https://academic.oup.com/mind/article/LIX/236/433/986238","sourceLabel":"Turing · Mind","tag":"평가","text":"튜링은 기계의 사고를 정의하는 대신 문자 대화에서 사람과 구별할 수 있는지를 묻는 평가를 제안했습니다.","title":"튜링의 모방 게임"},{"color":"#c8f23c","date":"1955 → 1956","era":"foundations","impact":"AI가 하나의 학문적 프로젝트로 묶임","source":"https://home.dartmouth.edu/about/artificial-intelligence-ai-coined-dartmouth","sourceLabel":"Dartmouth history","tag":"FIELD","text":"1955년 제안서가 1956년 다트머스 워크숍으로 이어지며, 지능의 여러 특징을 기계가 모사할 수 있다는 공동 연구 의제가 출발했습니다.","title":"AI라는 이름이 연구 의제가 되다"},{"color":"#2558db","date":"1955","era":"foundations","impact":"기호와 휴리스틱 탐색을 이용하는 AI 계보가 형성됐습니다.","source":"https://www.computerhistory.org/timeline/ai-robotics/","sourceLabel":"Computer History Museum","tag":"기호 AI","text":"Newell·Simon·Shaw가 정리 증명 프로그램 개발을 시작했습니다.","title":"Logic Theorist: 증명을 탐색하다"},{"color":"#2558db","date":"1958","era":"foundations","impact":"단일 구조의 성과를 범용 지능으로 확대 해석한 초기 기대도 함께 돌아볼 수 있습니다.","source":"https://news.cornell.edu/stories/2019/09/professors-perceptron-paved-way-ai-60-years-too-soon","sourceLabel":"Cornell","tag":"신경망","text":"Rosenblatt의 퍼셉트론은 입력 패턴을 학습해 구분하는 신경망 연구를 대중에게 보여줬습니다.","title":"퍼셉트론: 예제로 배우는 기계"},{"color":"#2558db","date":"1965","era":"foundations","impact":"제한된 분야에서는 명시적 전문 지식이 강력한 문제 해결 수단이 됐습니다.","source":"https://www.computerhistory.org/timeline/ai-robotics/","sourceLabel":"Computer History Museum","tag":"전문가 시스템","text":"화학 전문가의 규칙을 이용해 유기 화합물의 구조를 추론했습니다.","title":"DENDRAL과 전문가 지식"},{"color":"#2558db","date":"1966","era":"foundations","impact":"유창한 반응을 이해 능력으로 오인하는 문제가 드러났습니다.","source":"https://www.computerhistory.org/timeline/ai-robotics/","sourceLabel":"Computer History Museum","tag":"대화","text":"ELIZA의 DOCTOR는 키워드와 문장 치환으로 상담 대화를 흉내 냈습니다.","title":"ELIZA와 대화의 착각"},{"color":"#2558db","date":"1970","era":"agents","impact":"실제 환경의 행동 계획은 오늘날 도구 사용 에이전트와도 연결되는 연구 문제입니다.","source":"https://www.computerhistory.org/timeline/ai-robotics/","sourceLabel":"Computer History Museum","tag":"로봇","text":"SRI의 이동 로봇은 센서 관측과 계획을 결합해 주변 공간에서 이동했습니다.","title":"Shakey: 지각·계획·행동의 연결"},{"color":"#2cc4d4","date":"1986","era":"foundations","impact":"다층 표현학습의 훈련 경로가 열림","source":"https://www.nature.com/articles/323533a0","sourceLabel":"Nature / backprop","tag":"TRAINING","text":"Rumelhart·Hinton·Williams의 역전파 논문은 출력 오차를 뒤쪽 층에서 앞쪽으로 전파해 가중치를 조정하는 실용적 학습 절차를 정리했습니다.","title":"역전파가 깊은 신경망을 학습시키다"},{"color":"#9b8afb","date":"1997","era":"architectures","impact":"언어·음성·시계열의 장기 문맥 처리","source":"https://direct.mit.edu/neco/article/9/8/1735/6109/Long-Short-Term-Memory","sourceLabel":"MIT / LSTM","tag":"SEQUENCE","text":"Long Short-Term Memory는 긴 시간 간격의 정보를 다루는 그래디언트 문제를 완화해, 순차 데이터 모델링의 중요한 기준선이 됐습니다.","title":"LSTM이 긴 의존성을 기억하다"},{"color":"#2558db","date":"1997.05.11","era":"reasoning","impact":"특정 게임에서의 승리와 다른 환경으로 일반화하는 능력은 다릅니다.","source":"https://www.ibm.com/history/deep-blue","sourceLabel":"IBM","tag":"탐색","text":"IBM의 Deep Blue는 재대결에서 카스파로프를 이겼습니다. 전문 하드웨어, 체스 평가 함수와 대규모 탐색의 성과였습니다.","title":"Deep Blue가 체스 세계 챔피언을 이기다"},{"color":"#ff725d","date":"2012","era":"deep-learning","impact":"데이터·GPU·깊이가 성능 곡선을 바꿈","source":"https://papers.nips.cc/paper/4824-imagenet-classification-with-deep-convolutional-neural-networks","sourceLabel":"NeurIPS / AlexNet","tag":"DEEP LEARNING","text":"대규모 ImageNet 데이터와 GPU를 사용한 심층 합성곱 신경망이 이전 최고 성능을 크게 앞서며 ‘딥러닝 부흥’의 상징이 됐습니다.","title":"AlexNet이 이미지 인식을 다시 쓰다"},{"color":"#f3b640","date":"2013","era":"deep-learning","impact":"언어의 의미를 연속 벡터로 다루는 전환","source":"https://arxiv.org/abs/1301.3781","sourceLabel":"arXiv / word2vec","tag":"REPRESENTATION","text":"대규모 코퍼스에서 단어의 분포적 관계를 저비용으로 학습해, 단어 임베딩을 현대 NLP 파이프라인의 기본 부품으로 만들었습니다.","title":"word2vec이 단어를 벡터 공간에 놓다"},{"color":"#2558db","date":"2013.12","era":"deep-learning","impact":"지도학습의 정답 대신 보상을 이용해 순차적 의사결정을 개선했습니다.","source":"https://arxiv.org/abs/1312.5602","sourceLabel":"DQN 논문","tag":"강화학습","text":"Atari 게임의 영상 입력에서 행동 가치를 학습하는 심층 강화학습 접근이 제시됐습니다.","title":"DQN: 화면에서 행동 가치를 학습"},{"color":"#69a7ff","date":"2014","era":"deep-learning","impact":"생성 모델이 연구의 전면으로 이동","source":"https://papers.nips.cc/paper/5423-generative-adversarial-nets","sourceLabel":"NeurIPS / GAN","tag":"GENERATION","text":"생성자와 판별자를 미니맥스 게임으로 학습하는 Generative Adversarial Network가 이미지 합성 연구의 새 흐름을 열었습니다.","title":"GAN이 생성과 판별을 경쟁시키다"},{"color":"#2558db","date":"2014.09","era":"architectures","impact":"기계번역을 개별 규칙 대신 학습 가능한 종단 간 문제로 다루는 기반이 됐습니다.","source":"https://arxiv.org/abs/1409.3215","sourceLabel":"Seq2Seq 논문","tag":"언어","text":"인코더와 디코더 LSTM을 이용해 가변 길이 입력을 출력 시퀀스로 변환했습니다.","title":"Seq2Seq: 문장을 문장으로 변환"},{"color":"#2558db","date":"2015.12","era":"architectures","impact":"152층 이미지 인식 모델을 실험했으며, 깊이를 늘리는 것만으로 생기던 학습 어려움을 완화했습니다.","source":"https://arxiv.org/abs/1512.03385","sourceLabel":"ResNet 논문","tag":"비전","text":"층이 입력 자체보다 입력과 출력의 차이를 학습하게 해 매우 깊은 신경망의 최적화를 도왔습니다.","title":"ResNet의 잔차 연결"},{"color":"#c8f23c","date":"2016","era":"deep-learning","impact":"학습한 직관과 탐색의 결합을 증명","source":"https://www.nature.com/articles/nature16961","sourceLabel":"Nature / AlphaGo","tag":"RL / SEARCH","text":"정책·가치 신경망, 사람의 기보, 자기대국 강화학습, 몬테카를로 트리 탐색을 결합해 유럽 챔피언 판후이를 5대0으로 이겼습니다.","title":"AlphaGo 논문: 판후이에게 5대0 승리"},{"color":"#2558db","date":"2016.03","era":"deep-learning","impact":"정책·가치망과 탐색의 결합이 세계 최상위 바둑에서도 작동함을 보여줬습니다.","source":"https://deepmind.google/research/alphago/","sourceLabel":"Google DeepMind","tag":"강화학습","text":"AlphaGo는 이세돌과의 다섯 경기에서 4승 1패를 기록했습니다. 판후이 대국을 다룬 2016년 Nature 논문과는 별도 사건입니다.","title":"AlphaGo와 이세돌의 서울 대국"},{"color":"#2558db","date":"2016.09","era":"deep-learning","impact":"텍스트 처리와 별개였던 소리 생성에도 신경망이 핵심 구성요소로 자리 잡았습니다.","source":"https://arxiv.org/abs/1609.03499","sourceLabel":"WaveNet 논문","tag":"음성 · 사운드","text":"이전 오디오 샘플을 조건으로 다음 샘플을 예측하는 생성 모델이 자연스러운 음성 합성을 보여줬습니다.","title":"WaveNet: 음성 파형을 직접 생성"},{"color":"#2cc4d4","date":"2017","era":"architectures","impact":"오늘날 대규모 언어모델의 기본 골격","source":"https://arxiv.org/abs/1706.03762","sourceLabel":"Transformer paper","tag":"ARCHITECTURE","text":"순환이나 합성곱 없이 어텐션만으로 시퀀스를 처리하고 병렬화를 크게 높인 구조가 발표됐습니다.","title":"Transformer: Attention Is All You Need"},{"color":"#9b8afb","date":"2018","era":"architectures","impact":"전문가 데이터 의존을 줄인 강화학습","source":"https://www.science.org/doi/10.1126/science.aar6404","sourceLabel":"Science / AlphaZero","tag":"SELF-PLAY","text":"사람의 기보 없이 게임 규칙과 자기대국만으로 체스·쇼기·바둑에서 초인적 수준에 도달한 범용 자기대국 알고리즘이 소개됐습니다.","title":"AlphaZero가 규칙만으로 스스로 강해지다"},{"color":"#ff725d","date":"2018","era":"foundation-models","impact":"사전학습 후 적응하는 모델 패러다임","source":"https://arxiv.org/abs/1810.04805","sourceLabel":"arXiv / BERT","tag":"PRETRAINING","text":"문맥의 양방향 정보를 미리 학습한 뒤 과제에 맞게 미세조정하는 방식이 다양한 언어 이해 과제에서 강력한 기준선이 됐습니다.","title":"BERT가 양방향 사전학습을 표준화하다"},{"color":"#f3b640","date":"2019","era":"foundation-models","impact":"스케일링과 단계적 공개 논쟁","source":"https://openai.com/index/better-language-models/","sourceLabel":"OpenAI / GPT-2","tag":"SCALE","text":"1.5B 파라미터 언어모델이 긴 문장을 이어 쓰는 능력을 보여주며, 모델 규모와 생성 품질의 관계를 대중에게 각인시켰습니다.","title":"GPT-2가 대규모 생성의 가능성을 보여주다"},{"color":"#69a7ff","date":"2020","era":"foundation-models","impact":"모델 하나를 여러 작업에 재사용","source":"https://papers.nips.cc/paper/2020/hash/1457c0d6bfcb4967418bfb8ac142f64a-Abstract.html","sourceLabel":"NeurIPS / GPT-3","tag":"FEW-SHOT","text":"175B 파라미터와 few-shot prompting으로 별도 미세조정 없이 여러 언어 과제를 수행하며 ‘기초 모델’의 제품 가능성을 키웠습니다.","title":"GPT-3가 프롬프트만으로 과제를 넘나들다"},{"color":"#c8f23c","date":"2020","era":"foundation-models","impact":"생성형 AI가 텍스트 밖으로 확장","source":"https://proceedings.neurips.cc/paper/2020/hash/4c5bcfec8584af0d967f1ab10179ca4b-Abstract.html","sourceLabel":"NeurIPS / Diffusion","tag":"DIFFUSION","text":"노이즈를 단계적으로 제거하는 확산 기반 생성 방식이 고품질 이미지 합성의 주류 중 하나로 자리잡았습니다.","title":"확산 모델이 고품질 이미지 생성을 밀어 올리다"},{"color":"#2558db","date":"2020 → 2021","era":"science","impact":"아미노산 서열에서 3차원 구조를 예측해 생물학 연구를 지원하지만 실험 검증을 모두 대체하지는 않습니다.","source":"https://deepmind.google/blog/alphafold-five-years-of-impact/","sourceLabel":"Google DeepMind","tag":"과학","text":"2020년 CASP14 성과에 이어 2021년 연구와 구조 데이터 공개가 진행됐습니다.","title":"AlphaFold 2: 단백질 구조 예측"},{"color":"#2558db","date":"2020.05","era":"foundation-models","impact":"모든 정보를 모델 가중치에 넣지 않고 문서 저장소를 갱신할 수 있습니다. 검색 실패나 잘못된 인용까지 해결되는 것은 아닙니다.","source":"https://arxiv.org/abs/2005.11401","sourceLabel":"RAG 논문","tag":"검색","text":"언어모델과 외부 문서 검색기를 결합해 지식이 필요한 질문에 답하도록 학습했습니다.","title":"RAG: 검색 결과를 생성에 연결"},{"color":"#2558db","date":"2020.10","era":"architectures","impact":"언어와 비전에서 유사한 토큰 처리 구조를 활용하는 방향을 강화했습니다.","source":"https://arxiv.org/abs/2010.11929","sourceLabel":"ViT 논문","tag":"비전","text":"이미지를 작은 패치로 나눈 뒤 Transformer에 입력하는 방식이 대규모 사전학습의 효과를 보여줬습니다.","title":"ViT: 이미지 패치를 토큰으로"},{"color":"#2558db","date":"2021.02","era":"foundation-models","impact":"새로운 분류 작업을 텍스트 설명으로 지정하는 접근을 보여줬습니다. 데이터에 담긴 편향도 함께 평가해야 합니다.","source":"https://arxiv.org/abs/2103.00020","sourceLabel":"CLIP 논문","tag":"멀티모달","text":"이미지와 설명문을 대응시키는 대조학습으로 시각 표현을 학습했습니다.","title":"CLIP: 이미지와 언어를 함께 학습"},{"color":"#2558db","date":"2021.06","era":"architectures","impact":"전체 미세조정에 비해 학습 가능한 파라미터와 메모리 부담을 줄이는 방법입니다.","source":"https://arxiv.org/abs/2106.09685","sourceLabel":"LoRA 논문","tag":"미세조정","text":"기존 가중치를 고정하고 저랭크 행렬을 학습해 큰 모델을 새 작업에 적응시켰습니다.","title":"LoRA: 적은 파라미터로 적응"},{"color":"#2558db","date":"2021.12","era":"foundation-models","impact":"고해상도 생성의 계산 부담을 줄였습니다. 이 연구 발표일과 이후 제품 출시일은 구분합니다.","source":"https://arxiv.org/abs/2112.10752","sourceLabel":"Latent Diffusion 논문","tag":"이미지","text":"확산 과정을 픽셀 대신 압축된 잠재 표현에서 수행하고 조건 입력을 결합했습니다.","title":"Latent Diffusion: 압축 공간에서 생성"},{"color":"#2cc4d4","date":"2022.01","era":"foundation-models","impact":"사전학습과 제품 정렬의 분리","source":"https://openai.com/index/instruction-following/","sourceLabel":"OpenAI / InstructGPT","tag":"ALIGNMENT","text":"사람이 작성한 시범 답변과 선호 비교를 활용한 RLHF가 지시 따르기, 유용성, 안전성 조정의 실무 패턴으로 부상했습니다.","title":"InstructGPT가 인간 피드백을 학습하다"},{"color":"#2558db","date":"2022.01","era":"reasoning","impact":"중간 설명이 길다고 정답이 보장되지는 않습니다. 프롬프트 기법과 이후 추론 전용 모델을 구분합니다.","source":"https://arxiv.org/abs/2201.11903","sourceLabel":"Chain-of-Thought 논문","tag":"추론","text":"문제의 답뿐 아니라 풀이 과정을 프롬프트 예시로 제공해 일부 추론 과제의 성능을 개선했습니다.","title":"Chain-of-Thought: 중간 단계 예시"},{"color":"#2558db","date":"2022.10","era":"agents","impact":"검색·환경 상호작용을 묶는 에이전트 설계의 연구 기반입니다.","source":"https://arxiv.org/abs/2210.03629","sourceLabel":"ReAct 논문","tag":"에이전트","text":"언어모델이 추론 텍스트와 도구 행동을 교차 생성하고 관측 결과를 다음 단계에 반영했습니다.","title":"ReAct: 추론과 행동을 교대로"},{"color":"#ff725d","date":"2022.11.30","era":"foundation-models","impact":"연구 성과가 일상 인터페이스로 전환","source":"https://openai.com/index/chatgpt/","sourceLabel":"OpenAI / ChatGPT","tag":"CHAT","text":"InstructGPT 계열의 대화형 모델이 누구나 써볼 수 있는 제품 형태로 공개되며 생성형 AI의 사용 장벽을 크게 낮췄습니다.","title":"ChatGPT가 대화형 AI를 대중화하다"},{"color":"#2558db","date":"2022.12","era":"foundation-models","impact":"전사·번역의 강건성을 높였습니다. 이 날짜는 논문 공개일이며 최초 모델 공개일과 다릅니다.","source":"https://arxiv.org/abs/2212.04356","sourceLabel":"Whisper 논문","tag":"음성","text":"다양한 언어와 환경의 음성·텍스트 쌍으로 학습한 음성 인식 모델을 분석했습니다.","title":"Whisper 논문: 대규모 약지도 음성 인식"},{"color":"#2558db","date":"2023.02","era":"foundation-models","impact":"대형 모델만이 아니라 학습 데이터와 추론 비용의 균형에 주목했습니다. 초기 공개 정책과 후속 Llama 라이선스는 별개입니다.","source":"https://arxiv.org/abs/2302.13971","sourceLabel":"LLaMA 논문","tag":"공개 모델","text":"공개적으로 접근 가능한 데이터로 학습한 7B~65B 모델 계열을 연구 논문으로 발표했습니다.","title":"LLaMA: 효율적인 기반 언어모델"},{"color":"#f3b640","date":"2023.03.14","era":"foundation-models","impact":"범용성과 멀티모달 입력의 결합","source":"https://openai.com/index/gpt-4-research/","sourceLabel":"OpenAI / GPT-4","tag":"MULTIMODAL","text":"텍스트와 이미지 입력을 다루는 대규모 모델이 공개되며 언어·추론·전문 시험 성능을 함께 비교하는 시대가 열렸습니다.","title":"GPT-4가 범용 모델 경쟁의 새 기준이 되다"},{"color":"#2558db","date":"2023.04","era":"foundation-models","impact":"언어 생성 밖의 비전 작업에도 재사용 가능한 기반 모델 접근이 확장됐습니다.","source":"https://arxiv.org/abs/2304.02643","sourceLabel":"SAM 논문","tag":"비전","text":"점·박스 등의 프롬프트를 받아 이미지 영역을 분할하는 모델과 대규모 데이터셋을 제시했습니다.","title":"Segment Anything: 프롬프트로 영역 분할"},{"color":"#2558db","date":"2023.05","era":"reasoning","impact":"선호 조정 파이프라인을 단순화하지만 선호 데이터의 품질과 편향 문제는 남습니다.","source":"https://arxiv.org/abs/2305.18290","sourceLabel":"DPO 논문","tag":"정렬","text":"별도 보상 모델을 학습하는 RLHF 과정 대신 선호 쌍에서 정책을 직접 최적화하는 목적함수를 제안했습니다.","title":"DPO: 선호 데이터로 직접 최적화"},{"color":"#2558db","date":"2023.06","era":"foundation-models","impact":"음악은 음성 인식과 다른 생성 과제입니다. 구조·음질·조건 충실도와 사람의 청취 평가를 함께 봐야 합니다.","source":"https://arxiv.org/abs/2306.05284","sourceLabel":"MusicGen 논문","tag":"음악","text":"압축된 음악 토큰을 하나의 언어모델로 생성하고 텍스트 또는 멜로디로 제어했습니다.","title":"MusicGen: 텍스트와 멜로디 조건 생성"},{"color":"#69a7ff","date":"2023.12.06","era":"foundation-models","impact":"언어모델에서 멀티모달 모델로","source":"https://blog.google/innovation-and-ai/technology/ai/google-gemini-ai/","sourceLabel":"Google / Gemini","tag":"NATIVE MULTIMODAL","text":"텍스트·이미지·오디오·비디오를 함께 다루는 모델 계열이 공개되며 ‘모델의 입력 감각’ 자체가 경쟁 축으로 올라왔습니다.","title":"Gemini가 멀티모달을 처음부터 설계하다"},{"color":"#2558db","date":"2024.02.15","era":"foundation-models","impact":"연구 시연은 일반 출시와 다릅니다. 시각적 사실감이 정확한 물리 시뮬레이션을 보장하지도 않습니다.","source":"https://openai.com/index/video-generation-models-as-world-simulators/","sourceLabel":"OpenAI Sora 연구","tag":"영상","text":"영상과 이미지를 압축한 시공간 패치에서 확산 Transformer를 학습하는 연구가 공개됐습니다.","title":"Sora 연구 공개: 영상의 시공간 패치"},{"color":"#2cc4d4","date":"2024.05.13","era":"reasoning","impact":"멀티모달이 별도 모드가 아닌 기본 경험","source":"https://openai.com/index/gpt-4o-and-more-tools-to-chatgpt-free/","sourceLabel":"OpenAI / GPT-4o","tag":"REAL-TIME","text":"텍스트·비전·음성을 단일 모델 경험으로 묶으며 대화형 인터페이스의 지연과 상호작용 방식에 대한 기대를 바꿨습니다.","title":"GPT-4o가 음성  var fields=[["카테고리",function(m){return CATEGORY_LABELS[m.category]}],["제공사",function(m){return m.provider}],["정식 출시일",function(m){return m.releaseDate?formatDate(m.releaseDate):"미기재"}],["프리뷰일",function(m){return m.previewDate?formatDate(m.previewDate):"미기재"}],["API 제공일",function(m){return m.apiDate?formatDate(m.apiDate):"미기재"}],["입출력",function(m){return m.modality}],["접근 방식",function(m){return m.access+" · "+accessKindLabel(m)}],["라이선스",function(m){return m.license}],["주요 사양",function(m){return m.params}],["컨텍스트",function(m){return m.context}]];
 $("#modalRoot").innerHTML='<div class="modal-layer" data-close-modal="true"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-head"><div><h2 id="modalTitle">모델 비교</h2></div><button type="button" class="modal-close" data-action="close-modal" aria-label="비교 창 닫기">×</button></div><div class="compare-table"><table><thead><tr><th>항목</th>'+models.map(function(m){return'<th>'+esc(m.name)+'<br><button type="button" class="source-link" data-pin="'+esc(m.id)+'">고정 해제</button></th>'}).join("")+'</tr></thead><tbody>'+fields.map(function(f){return'<tr><td>'+f[0]+'</td>'+models.map(function(m){return'<td>'+esc(f[1](m))+'</td>'}).join("")+'</tr>'}).join("")+'</tbody></table></div></section></div>';
 document.body.classList.add("modal-open");setTimeout(function(){var b=$("[data-action=close-modal]");if(b)b.focus()},0);
}
function closeModal(){$("#modalRoot").innerHTML="";document.body.classList.remove("modal-open");state.modal=null;if(state.lastFocus&&state.lastFocus.focus)state.lastFocus.focus()}
function pin(id){var i=state.pins.indexOf(id);if(i>-1){state.pins.splice(i,1);toast("비교 고정에서 제거했습니다.")}else{if(state.pins.length>=4){toast("비교는 최대 4개 모델까지 고정할 수 있습니다.");return}state.pins.push(id);toast("비교에 고정했습니다.")}save();render();if(state.modal&&state.modal.kind==="model")openModel(id);else if(state.modal&&state.modal.kind==="compare")openCompare()}
function page(value){var a=value.split(":"),scope=a[0],n=Math.max(1,Number(a[1])||1);if(scope==="catalog")state.catalogPage=n;if(scope==="media")state.mediaPage=n;if(scope==="history")state.historyPage=n;if(scope==="benchmark")state.benchmarkPage=n;render();window.scrollTo({top:0,behavior:"auto"})}
function bind(){
 document.addEventListener("click",function(e){
  var back=e.target.closest("[data-close-modal=true]");if(back&&e.target===back){closeModal();return}
  var r=e.target.closest("[data-route]");if(r){e.preventDefault();if((r.dataset.route==="opensource"||r.dataset.route==="catalog")&&!r.dataset.category&&!r.dataset.region){state.catalogCategory="all";state.catalogQuery="";state.catalogAccess="all";state.catalogRegion="all";state.catalogSort="latest";state.catalogPage=1}else if(r.dataset.category){state.catalogCategory=r.dataset.category;state.catalogQuery="";state.catalogAccess="all";state.catalogRegion=r.dataset.region||"all";state.catalogSort="latest";state.catalogPage=1}else if(r.dataset.region){state.catalogRegion=r.dataset.region;state.catalogPage=1}go(r.dataset.route);return}
  var m=e.target.closest("[data-model]");if(m){openModel(m.dataset.model);return}
  var p=e.target.closest("[data-pin]");if(p){pin(p.dataset.pin);return}
  var pg=e.target.closest("[data-page]");if(pg){page(pg.dataset.page);return}
  var ca=e.target.closest("[data-catalog-access]");if(ca){state.catalogAccess=ca.dataset.catalogAccess;state.catalogPage=1;render();return}
  var cc=e.target.closest("[data-catalog-category]");if(cc){state.catalogCategory=cc.dataset.catalogCategory;state.catalogPage=1;render();return}
  var mc=e.target.closest("[data-media-category]");if(mc){state.mediaCategory=mc.dataset.mediaCategory;state.mediaPage=1;render();return}
  var he=e.target.closest("[data-history-era]");if(he){state.historyEra=he.dataset.historyEra;state.historyExpanded=false;render();return}
  var mt=e.target.closest("[data-metric]");if(mt){state.metric=mt.dataset.metric;state.benchmarkCohort="";state.benchmarkPage=1;render();return}
  var ac=e.target.closest("[data-action]");if(ac){if(ac.dataset.action==="theme"){state.theme=state.theme==="dark"?"light":"dark";save();render()}else if(ac.dataset.action==="expand-history"){state.historyExpanded=true;render()}else if(ac.dataset.action==="compare"){openCompare()}else if(ac.dataset.action==="close-modal"){closeModal()}return}
 });
 document.addEventListener("input",function(e){if(e.target&&e.target.id==="historySearch"){state.historyQuery=e.target.value;state.historyPage=1;render("#historySearch");return}if(e.target&&e.target.id==="catalogSearch"){state.catalogQuery=e.target.value;state.catalogPage=1;render("#catalogSearch")}});
 document.addEventListener("change",function(e){if(!e.target)return;if(e.target.id==="benchmarkMetric"){state.metric=e.target.value;state.benchmarkCohort="";state.benchmarkPage=1;render("#benchmarkMetric");return}if(e.target.id==="benchmarkCohort"){state.benchmarkCohort=e.target.value;state.benchmarkPage=1;render("#benchmarkCohort");return}if(e.target.id==="historyPeriod"){state.historyPeriod=e.target.value;state.historyPage=1;render("#historyPeriod");return}if(e.target.id==="historyTopic"){state.historyEra=e.target.value;state.historyPage=1;render("#historyTopic");return}if(e.target.id==="catalogRegion"){state.catalogRegion=e.target.value;state.catalogPage=1;render()}if(e.target.id==="catalogAccess"){state.catalogAccess=e.target.value;state.catalogPage=1;render()}if(e.target.id==="catalogSort"){state.catalogSort=e.target.value;state.catalogPage=1;render()}});
 document.addEventListener("submit",function(e){if(e.target&&e.target.id==="globalSearchForm"){e.preventDefault();state.catalogQuery=$("#globalSearch").value.trim();state.catalogCategory="all";state.catalogRegion="all";state.catalogAccess="all";state.catalogPage=1;go("catalog")}});
 document.addEventListener("keydown",function(e){
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){e.preventDefault();$("#globalSearch").focus();return}
  if(e.key==="/"&&["INPUT","TEXTAREA","SELECT"].indexOf(document.activeElement.tagName)===-1){e.preventDefault();$("#globalSearch").focus();return}
  if(e.key==="Escape"&&state.modal){e.preventDefault();closeModal();return}
  if(e.key==="Tab"&&state.modal){var modal=$(".modal");if(!modal)return;var f=$$("button,[href],input,select,[tabindex]:not([tabindex='-1'])",modal).filter(function(x){return!x.disabled});if(!f.length)return;var first=f[0],last=f[f.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}
 });
 window.addEventListener("hashchange",function(){state.route=routeNow();render();window.scrollTo({top:0,behavior:"auto"});var main=$("#content");if(main)main.focus({preventScroll:true})});
}
shell();state.route=routeNow();bind();render();

</script>
