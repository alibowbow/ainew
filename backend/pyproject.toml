[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-news-portal-backend"
version = "0.1.0"
description = "FastAPI API + ingestion jobs for an AI ecosystem news portal"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.0",
  "uvicorn[standard]>=0.35.0",
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.2.0",
  "pg8000>=1.31.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.8.0",
  "httpx>=0.28.0",
  "beautifulsoup4>=4.12.0",
  "trafilatura>=2.0.0",
  "feedparser>=6.0.11",
  "python-dateutil>=2.9.0",
  "python-slugify>=8.0.4",
  "tenacity>=9.0.0",
  "google-genai>=1.30.0",
  "cloud-sql-python-connector>=1.18.0",
  "orjson>=3.10.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["src"]
