<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Model Atlas 반응형 검사</title>
<style>body{font:14px system-ui;margin:16px}main{display:flex;gap:20px;flex-wrap:wrap}iframe{border:1px solid #ccc}output{display:block;max-width:440px;margin:8px 0}.pass{color:#086}.fail{color:#b22}</style>
<h1>Model Atlas 반응형 검사</h1><main id="frames"></main>
<script>
for(const route of ['overview','catalog','benchmarks'])for(const width of [320,390,768,1280]){
 const section=document.createElement('section'),heading=document.createElement('h2'),output=document.createElement('output'),frame=document.createElement('iframe');
 heading.textContent=route+' · '+width+'px';
 frame.width=width;
 frame.height=844;
 frame.title=heading.textContent;
 frame.onload=async()=>{try{
  const doc=frame.contentDocument,w=frame.contentWindow,errors=[];
  await doc.fonts.ready;
  const check=(valid,message)=>{if(!valid)errors.push(message)};
  const content=doc.querySelector('#content');
  check(doc.documentElement.scrollWidth<=w.innerWidth+1&&content?.scrollWidth<=content?.clientWidth+1,'페이지 가로 넘침');
  check(content?.querySelector('h1'),'화면 미표시');
  if(route==='overview'){
   check(content.querySelector('h1').textContent==='모델 개요','개요 제목 누락');
   check(content.querySelector('.release-row')?.textContent.includes('Gemini 4 Neon'),'최근 출시 누락');
   check(content.querySelector('.overview-index-row')?.getBoundingClientRect().top<720,'순위가 첫 화면에서 너무 아래에 표시');
  }
  if(route==='catalog'){
   check(content.querySelector('.model-card'),'모델 누락');
   check(content.textContent.includes('Gemini 4 Neon'),'최신 모델 누락');
  }
  if(route==='benchmarks'){
   check(content.querySelector('[data-cohort="terminal41-checked-20261119"]'),'최신 Terminal-Bench 바로가기 누락');
   check(content.querySelector('[data-cohort="vals-science-20261118"]'),'최신 Vals Science 바로가기 누락');
   const table=content.querySelector('.intelligence-table');
   const modelCell=table?.tBodies[0].rows[2]?.cells[0];
   const row=modelCell?.parentElement;
   check(table&&modelCell,'순위표 누락');
   if(table&&row){
    check(modelCell.getBoundingClientRect().width>=table.getBoundingClientRect().width*0.52,'모델명 열이 너무 좁음');
    check(modelCell.textContent.includes('Gemini 4 Neon')&&row.cells[2].textContent.trim()==='61','Neon 순위 누락');
    check(row.getBoundingClientRect().height<64,'행 높이 과다');
    const score=row.querySelector('.index-value');
    check(score&&score.getBoundingClientRect().height<=parseFloat(w.getComputedStyle(score).lineHeight)+1,'점수가 한 줄에 표시되지 않음');
   }
  }
  output.className=errors.length?'fail':'pass';
  output.textContent=errors.length?'FAIL · '+errors.join(', '):'PASS · 콘텐츠와 레이아웃 확인';
 }catch(e){output.className='fail';output.textContent='FAIL · '+e.message}};
 // Carry the preview version through to the framed page after a deployment.
 frame.src='../index.html'+location.search+'#/'+route;
 section.append(heading,output,frame);
 document.getElementById('frames').append(section);
}
</script></html>
