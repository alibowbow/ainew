<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Model Atlas · 반응형 레이아웃 확인</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:16px;background:#e5eaf2;color:#14243e;font:14px/1.5 system-ui,sans-serif}h1{font-size:18px;margin:0 0 8px}p{margin:0 0 12px}.preview-grid{display:flex;flex-wrap:wrap;gap:20px}.preview{flex:none}h2{font-size:14px;margin:0 0 6px}.result{max-width:768px;min-height:44px;font-size:12px}.result.pass{color:#087f68}.result.fail{color:#a43131}iframe{display:block;box-sizing:content-box;border:1px solid #b8c4d5;border-radius:10px;background:#fff}button{min-height:44px;padding:8px 16px;border:1px solid #b8c4d5;border-radius:8px;background:#fff;color:inherit;font:inherit;cursor:pointer;margin-bottom:16px}
</style>
</head>
<body>
<h1>AI 역사 · 반응형 확인</h1>
<p>같은 페이지를 실제 프레임 너비로 표시하고 본문 폭·가로 넘침·첫 항목 위치를 확인합니다.</p>
<button id="check">다시 확인</button>
<div class="preview-grid">
<section class="preview"><h2>모바일 · 390 × 844</h2><p class="result" id="mobile-result">확인 중</p><iframe id="mobile" title="모바일 390px" width="390" height="844" src="../index.html#/history"></iframe></section>
<section class="preview"><h2>태블릿 · 768 × 844</h2><p class="result" id="tablet-result">확인 중</p><iframe id="tablet" title="태블릿 768px" width="768" height="844" src="../index.html#/history"></iframe></section>
<section class="preview"><h2>데스크톱 · 1280 × 900</h2><p class="result" id="desktop-result">확인 중</p><iframe id="desktop" title="데스크톱 1280px" width="1280" height="900" src="../index.html#/history"></iframe></section>
</div>
<script>
function checkFrame(frame){
 const result=document.getElementById(frame.id+'-result');
 try{
  const w=frame.contentWindow,d=frame.contentDocument,events=[...d.querySelectorAll('.history-event')],copies=[...d.querySelectorAll('.history-copy')];
  if(!events.length)throw Error('타임라인이 표시되지 않았습니다.');
  const widths=copies.map(el=>el.getBoundingClientRect().width),first=events[0].getBoundingClientRect(),min=Math.min(...widths),font=parseFloat(w.getComputedStyle(d.querySelector('.history-summary')).fontSize),visible=events.filter(el=>el.getBoundingClientRect().top<w.innerHeight).length;
  const errors=[];
  if(min<w.innerWidth*(w.innerWidth<=600?.75:.5))errors.push('본문 폭 부족');
  if(d.documentElement.scrollWidth>w.innerWidth+1)errors.push('페이지 가로 넘침');
  if(first.top>300)errors.push('첫 항목이 너무 아래에 위치');
  if(font<14)errors.push('본문 글자 크기 부족');
  if(d.getElementById('globalSearchForm').getBoundingClientRect().height>0)errors.push('중복 모델 검색 표시');
  result.className='result '+(errors.length?'fail':'pass');
  result.textContent=(errors.length?'FAIL · '+errors.join(', '):'PASS')+' · 본문 '+Math.round(min)+'px · 첫 항목 y='+Math.round(first.top)+'px · 화면 내 '+visible+'개 항목';
 }catch(e){result.className='result fail';result.textContent='FAIL · '+e.message;}
}
document.querySelectorAll('iframe').forEach(frame=>frame.addEventListener('load',()=>checkFrame(frame)));
document.getElementById('check').addEventListener('click',()=>document.querySelectorAll('iframe').forEach(checkFrame));
</script>
</body>
</html>
